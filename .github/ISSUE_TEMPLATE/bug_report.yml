name: Bug report
description: Something in V-OS does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: V-OS version
      description: Settings > About, or the Launcher's status page.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Area
      options: [Shell (bar, capsule, dock), Command and search, Control center, Activity, Files, Browser, Music, Weather, Settings, Monitor, Notes, Time, Capture, Store, Gaming, Assistant, Translate, Connect, Flow, Launcher / installer / updates, Other]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 25H2 (26200)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Launcher > Diagnostics > Export creates a zip with logs. Review it before attaching; it never contains your files.
