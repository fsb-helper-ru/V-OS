name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
      - name: Restore
        run: dotnet restore V-OS.slnx
      - name: Build (Release, warnings reported)
        run: dotnet build V-OS.slnx -c Release --no-restore
      - name: Unit and integration tests
        run: dotnet test V-OS.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Vulnerable dependency scan
        run: dotnet list V-OS.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
